<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>In Dev Lab 2</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #121212;
            color: #fff;
        }

        .card {
            text-align: center;
            padding: 2rem;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 340px;
            width: 90%;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            margin: 0 auto 12px auto;
        }

        input {
            padding: 10px 40px 10px 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #fff;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .toggle-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
        }

        .toggle-btn:hover {
            color: #fff;
            background: none;
        }

        button#btn-enter {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            background: #007acc;
            color: #fff;
            cursor: pointer;
        }

        button#btn-enter:hover {
            background: #005999;
        }

        .hidden {
            display: none;
        }

        img {
            border: 8px solid #fff;
            border-radius: 8px;
            margin-top: 15px;
        }

        a {
            color: #4daafc;
            word-break: break-all;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 8px;
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status-standby {
            background: #6c757d;
            color: #fff;
        }

        .status-online {
            background: #28a745;
            color: #fff;
        }

        .status-offline {
            background: #dc3545;
            color: #fff;
        }

        .timestamp {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>In Dev Lab 2</h2>
        <div id="status-container">
            <span id="status-badge" class="status-badge status-standby">● STANDBY</span>
            <div id="update-time" class="timestamp">更新日時を取得中...</div>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <div id="login-form">
            <p>Passcode</p>
            <div class="input-group">
                <input type="password" id="pass-input" placeholder="****">
                <button type="button" id="btn-toggle-pass" class="toggle-btn" onclick="togglePassword()">👁️</button>
            </div>
            <button id="btn-enter" onclick="checkPass()">Enter</button>
            <p id="error-msg" class="error hidden"></p>
        </div>

        <div id="content" class="hidden">
            <p>Access Link</p>
            <img id="qr-img" src="" alt="QR Code"><br>
            <a id="access-link" href="#" target="_blank" rel="noopener"></a>
        </div>
    </div>

    <script>
        const APP_VERSION = "v3.2.4 Direct Timestamp";
        console.log("System Version:", APP_VERSION);

        const ENC_GIST_URL = "44c82b5c8b3b92a924925526fc2b6282069ce7a788c7e31c98147dffafc591de0deb78d05551bb890c915fb4709fafcf09305a1ddf86c93e61583a053bfd2e0324905b20011ce7b938082233ef662b24b1612dfd3674e9fbf647c93a0c807df2753da59313ffcb8519f6d8cd12f31d1a094bd1e15033f1c00f480c1678b75e56f49cffd1d9d99694d1ccfb3bc37d7842";
        const LAST_BUILD_TIME = "2026/09/07 10:46:27";

        window.addEventListener('DOMContentLoaded', () => {
            if (LAST_BUILD_TIME) {
                document.getElementById('update-time').innerText = "最終更新: " + LAST_BUILD_TIME + " (JST)";
            }
        });

        function togglePassword() {
            const passInput = document.getElementById('pass-input');
            const toggleBtn = document.getElementById('btn-toggle-pass');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function setStatus(statusType, labelText) {
            const badge = document.getElementById('status-badge');
            badge.innerText = labelText;
            badge.className = "status-badge status-" + statusType;
        }

        function hexToBytes(hex) {
            if (!hex || hex.length % 2 !== 0) {
                throw new Error("Invalid Hex String");
            }
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
            }
            return bytes;
        }

        async function deriveGistIv(pass) {
            const buf = new TextEncoder().encode(pass + "_gist_iv_salt");
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return new Uint8Array(hash).slice(0, 16);
        }

        async function decryptData(encHex, ivBytes, pass) {
            const passBuffer = new TextEncoder().encode(pass);
            const keyHash = await crypto.subtle.digest('SHA-256', passBuffer);
            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyHash, { name: 'AES-CBC' }, false, ['decrypt']
            );

            const cipherBytes = hexToBytes(encHex);
            const decryptedBuffer = await crypto.subtle.decrypt(
                { name: 'AES-CBC', iv: ivBytes },
                cryptoKey,
                cipherBytes
            );

            return new TextDecoder().decode(decryptedBuffer);
        }

        async function checkPass() {
            const btn = document.getElementById('btn-enter');
            const pass = document.getElementById('pass-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (!pass) return;
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const genericError = "パスコードが正しくないか、サーバーが起動していません。";

            try {
                if (!ENC_GIST_URL) {
                    throw new Error(genericError);
                }

                const gistIvBytes = await deriveGistIv(pass);

                let gistUrl = "";
                try {
                    gistUrl = await decryptData(ENC_GIST_URL, gistIvBytes, pass);
                } catch {
                    throw new Error(genericError);
                }

                let res;
                try {
                    res = await fetch(gistUrl + "?_=" + Date.now());
                    if (!res.ok) throw new Error(genericError);
                } catch {
                    throw new Error(genericError);
                }

                const { ENC_DATA, ENC_IV } = await res.json();

                let realUrl = "";
                try {
                    realUrl = await decryptData(ENC_DATA, hexToBytes(ENC_IV), pass);
                } catch {
                    throw new Error(genericError);
                }

                const imgTester = new Image();
                let isHandled = false;

                const timer = setTimeout(() => {
                    if (!isHandled) {
                        isHandled = true;
                        btn.disabled = false;
                        setStatus("offline", "● OFFLINE");
                        errorMsg.innerText = "エラー: サーバーが応答しません";
                        errorMsg.classList.remove('hidden');
                    }
                }, 3000);

                imgTester.onload = () => {
                    if (isHandled) return;
                    isHandled = true;
                    clearTimeout(timer);
                    btn.disabled = false;

                    setStatus("online", "● ONLINE");
                    document.getElementById('login-form').classList.add('hidden');

                    document.getElementById('qr-img').src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(realUrl);
                    const linkElem = document.getElementById('access-link');
                    linkElem.href = realUrl;
                    linkElem.innerText = realUrl;
                    document.getElementById('content').classList.remove('hidden');
                };

                imgTester.onerror = () => {
                    if (isHandled) return;
                    isHandled = true;
                    clearTimeout(timer);
                    btn.disabled = false;

                    setStatus("offline", "● OFFLINE");
                    errorMsg.innerText = "エラー: サーバーにアクセスできませんでした";
                    errorMsg.classList.remove('hidden');
                };

                imgTester.src = realUrl + "/static/favicon.ico?_=" + Date.now();

            } catch (e) {
                btn.disabled = false;
                errorMsg.innerText = e.message || genericError;
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
